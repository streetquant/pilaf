name: Verify and publish ForkRoom v1.1.0-post.2

on:
  push:
    branches: [forkroom-v1.1.0-post.2-lab]
    paths:
      - forkroom-post2/**
      - .github/workflows/forkroom-post2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forkroom-v1.1.0-post.2
  cancel-in-progress: true

jobs:
  verify-publish:
    name: Verify, publish, and package post.2
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated release lab
        uses: actions/checkout@v6
        with:
          ref: forkroom-v1.1.0-post.2-lab
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release-program integrity and syntax
        run: |
          set -euo pipefail
          (
            cd forkroom-post2
            sha256sum --check release_post2.sh.sha256
          )
          bash -n forkroom-post2/release_post2.sh

      - name: Run reproducible release program
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash forkroom-post2/release_post2.sh

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ForkRoom-v1.1.0-post.2-verified
          path: |
            forkroom-post2/output/ForkRoom-v1.1.0-post.2-verified.zip
            forkroom-post2/output/ForkRoom-v1.1.0-post.2-verified.zip.sha256
            forkroom-post2/output/POST2_SUMMARY.md
          if-no-files-found: error
          retention-days: 90
