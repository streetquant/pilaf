name: Verify and publish ForkRoom v1.1.0-post.2

on:
  push:
    branches: [forkroom-v1.1.0-post.2-lab]
    paths:
      - forkroom-post2/**
      - .github/workflows/forkroom-post2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forkroom-v1.1.0-post.2
  cancel-in-progress: true

jobs:
  verify-publish:
    name: Verify, publish, and package post.2
    runs-on: ubuntu-24.04
    steps:
      - name: Check out isolated release lab
        uses: actions/checkout@v6
        with:
          ref: forkroom-v1.1.0-post.2-lab
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify and migrate the release program
        run: |
          set -euo pipefail
          (
            cd forkroom-post2
            sha256sum --check release_post2.sh.sha256
            sha256sum --check fix_release_post2.py.sha256
            python -m py_compile fix_release_post2.py
          )
          cp forkroom-post2/release_post2.sh "$RUNNER_TEMP/release_post2.sh"
          python forkroom-post2/fix_release_post2.py "$RUNNER_TEMP/release_post2.sh"
          printf '%s  %s\n' \
            '6b22a8522852522bb950e0f8da5035a74568ed218993064e0a7be02cba804ad3' \
            "$RUNNER_TEMP/release_post2.sh" \
            | sha256sum --check
          bash -n "$RUNNER_TEMP/release_post2.sh"

      - name: Run reproducible release program
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release_post2.sh"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ForkRoom-v1.1.0-post.2-verified
          path: |
            forkroom-post2/output/ForkRoom-v1.1.0-post.2-verified.zip
            forkroom-post2/output/ForkRoom-v1.1.0-post.2-verified.zip.sha256
            forkroom-post2/output/POST2_SUMMARY.md
          if-no-files-found: error
          retention-days: 90
