<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ForkRoom — See the future before you choose it</title>
  <desc id="desc">A decision constellation connects a shared question with alternative options and futures.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#173129"/>
      <stop offset="1" stop-color="#07100f"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#dbe9df" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g fill="none" stroke="#dbe9df" opacity=".17">
    <circle cx="840" cy="315" r="128" stroke-dasharray="4 10"/>
    <circle cx="840" cy="315" r="220" stroke-dasharray="2 13"/>
    <path d="M840 315 680 145M840 315 1025 156M840 315 1062 414M840 315 687 494"/>
  </g>
  <g>
    <circle cx="840" cy="315" r="88" fill="#11221d" stroke="#c8ff64" stroke-opacity=".6" stroke-width="2"/>
    <text x="840" y="289" text-anchor="middle" fill="#c8ff64" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">SHARED QUESTION</text>
    <text x="840" y="320" text-anchor="middle" fill="#f3f0e5" font-family="Georgia,serif" font-size="20">Which future survives</text>
    <text x="840" y="346" text-anchor="middle" fill="#f3f0e5" font-family="Georgia,serif" font-size="20">our assumptions?</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(605 87)">
      <rect width="194" height="94" rx="18" fill="#101d19" stroke="#c8ff64" stroke-opacity=".55"/>
      <circle cx="34" cy="43" r="21" fill="#c8ff64"/>
      <text x="34" y="49" text-anchor="middle" fill="#07100f" font-size="15" font-weight="900">82</text>
      <text x="66" y="37" fill="#f3f0e5" font-size="15" font-weight="700">OPTION A</text>
      <text x="66" y="58" fill="#91a09a" font-size="10">Fast · equitable · reversible</text>
    </g>
    <g transform="translate(973 110)">
      <rect width="194" height="94" rx="18" fill="#101d19" stroke="#70e8ff" stroke-opacity=".55"/>
      <circle cx="34" cy="43" r="21" fill="#70e8ff"/>
      <text x="34" y="49" text-anchor="middle" fill="#07100f" font-size="15" font-weight="900">77</text>
      <text x="66" y="37" fill="#f3f0e5" font-size="15" font-weight="700">OPTION B</text>
      <text x="66" y="58" fill="#91a09a" font-size="10">Durable · outage resilient</text>
    </g>
    <g transform="translate(1010 375)">
      <rect width="170" height="94" rx="18" fill="#101d19" stroke="#ff7e68" stroke-opacity=".55"/>
      <circle cx="34" cy="43" r="21" fill="#ff7e68"/>
      <text x="34" y="49" text-anchor="middle" fill="#07100f" font-size="15" font-weight="900">79</text>
      <text x="66" y="37" fill="#f3f0e5" font-size="15" font-weight="700">OPTION C</text>
      <text x="66" y="58" fill="#91a09a" font-size="10">Balanced · targeted</text>
    </g>
    <g transform="translate(575 448)">
      <rect width="194" height="94" rx="18" fill="#101d19" stroke="#baa4ff" stroke-opacity=".55"/>
      <circle cx="34" cy="43" r="21" fill="#baa4ff"/>
      <text x="34" y="49" text-anchor="middle" fill="#07100f" font-size="15" font-weight="900">74</text>
      <text x="66" y="37" fill="#f3f0e5" font-size="15" font-weight="700">OPTION D</text>
      <text x="66" y="58" fill="#91a09a" font-size="10">Adaptive · rapid response</text>
    </g>
  </g>
  <g transform="translate(76 75)">
    <g transform="translate(0 3)">
      <rect width="66" height="66" rx="19" fill="#0b1814" stroke="#c8ff64" stroke-opacity=".65"/>
      <path d="M19 17v9c0 9 5 13 14 13s14-4 14-13v-9M33 39v13" fill="none" stroke="#c8ff64" stroke-width="5" stroke-linecap="round"/>
      <circle cx="19" cy="16" r="5" fill="#70e8ff"/>
      <circle cx="47" cy="16" r="5" fill="#ff7e68"/>
      <circle cx="33" cy="53" r="5" fill="#baa4ff"/>
    </g>
    <text x="84" y="43" fill="#f3f0e5" font-family="Georgia,serif" font-size="42">ForkRoom</text>
    <text x="0" y="150" fill="#c8ff64" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3">HUMAN × AGENT DECISION MULTIVERSE</text>
    <text x="0" y="207" fill="#f3f0e5" font-family="Georgia,serif" font-size="50">See the future</text>
    <text x="0" y="265" fill="#f3f0e5" font-family="Georgia,serif" font-size="50">before you choose it.</text>
    <text x="0" y="321" fill="#91a09a" font-family="Inter,Arial,sans-serif" font-size="20">People set values and authority.</text>
    <text x="0" y="351" fill="#91a09a" font-family="Inter,Arial,sans-serif" font-size="20">Agents expand, challenge, and stress-test.</text>
    <g transform="translate(0 405)" font-family="Inter,Arial,sans-serif">
      <rect width="346" height="56" rx="14" fill="#c8ff64"/>
      <text x="23" y="35" fill="#07100f" font-size="16" font-weight="800">16 LIVE WEBMCP SITE TOOLS</text>
    </g>
    <text x="0" y="507" fill="#61716a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1.5">VISIBLE · REVERSIBLE · AUDITABLE</text>
  </g>
